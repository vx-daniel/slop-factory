name: Test-quality audit

# Mutation-based test-suite audit, run on demand. Produces a findings GitHub issue; it does NOT gate merges,
# because a mutation audit is advisory by nature and too slow to sit in the merge path.
#
# REQUIRES the repository secret `CLAUDE_CODE_OAUTH_TOKEN`. The job checks for it first and writes a note to
# the run summary if it is absent, so an unconfigured repository stays green.
#
# BOTH PREREQUISITES ARE ALREADY MET in a project generated by this factory:
#   - the audit runs a JS test runner (`npx vitest run` by default), and
#   - it loads the test-quality skill from `.claude/skills/test-quality/`, which ships with the project.
# If you chose `bun test` rather than Vitest, set `test_command` to `bun test` when dispatching.
on:
  workflow_dispatch:
    inputs:
      scope:
        type: string
        required: false
        default: "all *.test.ts under src/"
      test_command:
        type: string
        required: false
        # The runner the agent uses for the baseline and per-file mutation runs.
        # Any JS test runner works (jest, bun test, npm test, npm run test:unit).
        # Non-Node runners assume the setup/install steps below are adjusted too.
        default: npx vitest run
      model:
        type: string
        required: false
        default: claude-sonnet-5
      effort:
        type: string
        required: false
        default: high
      max_turns:
        type: string
        required: false
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Org-wide Claude Code OAuth token (provisioned by the GitHub admin).
        required: true

permissions:
  contents: read   # read the repo; NOT write — the agent mutates only the ephemeral
                   # working tree and reverts; it must never push source.
  issues: write    # create the findings issue
  id-token: write  # claude-code-action fetches a GitHub OIDC token to mint its GH
                   # App token (its github_token input is empty); without this the
                   # action aborts with "Could not fetch an OIDC token" before any
                   # audit runs.

jobs:
  audit:
    name: Mutation-based test audit
    runs-on: ubuntu-latest
    # A whole-suite mutation audit is many model turns; give it room but bound it.
    timeout-minutes: 30
    steps:
      # THE MISSING-TOKEN GUARD. It must be a step, not a job-level `if:` — GitHub does not expose the
      # `secrets` context in job-level conditions, only in step `env`. Without it the action stubs out
      # silently and the run goes green having done nothing, which looks exactly like success.
      - name: Check for the Claude token
        id: token
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLAUDE_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Test-quality audit skipped"
            echo
            echo 'No `CLAUDE_CODE_OAUTH_TOKEN` secret is set on this repository, so it did not run.'
            echo
            echo 'To enable: **Settings → Secrets and variables → Actions → New repository secret**, named'
            echo '`CLAUDE_CODE_OAUTH_TOKEN`. See `docs/claude-workflows.md`.'
            echo
            echo 'This is not a failure — the workflow skips cleanly until the secret exists.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        if: steps.token.outputs.present == 'true'

      # The agent runs the suite and per-test mutations, so it needs real deps.
      - uses: actions/setup-node@v7
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      # Dispatch inputs arrive as plain strings, so they are allowlist-validated here rather than trusted
      # inputs, they are NOT constrained to a fixed option set. model/effort are
      # interpolated into claude_args/settings and max_turns into claude_args, so
      # a crafted caller value ("claude-opus-4-8 --dangerously-skip-permissions")
      # would be an injection vector. Validate ALL THREE against allowlists here,
      # via env (never interpolate untrusted input straight into a run: script),
      # BEFORE they reach the action step. `case` globs match the WHOLE string, so
      # an embedded newline is rejected. This step runs first; an invalid value
      # fails the job before the action step renders.
      - name: Validate inputs
        if: steps.token.outputs.present == 'true'
        env:
          MODEL_RAW: ${{ inputs.model }}
          EFFORT_RAW: ${{ inputs.effort }}
          MAX_TURNS_RAW: ${{ inputs.max_turns }}
          TEST_COMMAND_RAW: ${{ inputs.test_command }}
        run: |
          # test_command is interpolated into the prompt AND into --allowedTools as
          # Bash(<test_command>:*). Restrict it to a shell-metacharacter-free set so
          # a caller cannot chain commands or break out of the allowlist wrapper.
          # `case` (not grep) so an embedded newline is caught, not just per-line.
          case "$TEST_COMMAND_RAW" in
            '')
              echo "::error::test_command must not be empty"
              exit 1
              ;;
            *[!A-Za-z0-9\ ._/:-]*)
              echo "::error::test_command allows only letters, digits, spaces and . _ / : - (got: '$TEST_COMMAND_RAW')"
              exit 1
              ;;
          esac
          case "$MODEL_RAW" in
            claude-sonnet-5|claude-opus-4-8) ;;
            *)
              echo "::error::model must be claude-sonnet-5 or claude-opus-4-8 (got: '$MODEL_RAW')"
              exit 1
              ;;
          esac
          case "$EFFORT_RAW" in
            low|medium|high|xhigh|max) ;;
            *)
              echo "::error::effort must be one of low|medium|high|xhigh|max (got: '$EFFORT_RAW')"
              exit 1
              ;;
          esac
          case "$MAX_TURNS_RAW" in
            '') ;;
            *[!0-9]*)
              echo "::error::max_turns must be a positive integer or blank (got: '$MAX_TURNS_RAW')"
              exit 1
              ;;
          esac

      - name: Run test-quality audit
        if: steps.token.outputs.present == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # `gh` in the agent's Bash tool needs a token to create the issue.
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ inputs.scope }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Reasoning effort is set via the CLAUDE_CODE_EFFORT_LEVEL env var, NOT
          # the --effort flag (that flag is parsed but not propagated to the API).
          # inputs.effort is allowlist-validated above, so interpolating it here
          # is injection-safe.
          settings: |
            {"env": {"CLAUDE_CODE_EFFORT_LEVEL": "${{ inputs.effort }}"}}
          prompt: |
            REPO: ${{ github.repository }}
            SCOPE: $SCOPE

            ## Method
            Load `.claude/skills/test-quality/SKILL.md` for the principles and the
            fig-leaf / mock checklists. This is a CI-ADAPTED SERIAL audit — it does
            NOT follow `workflows/review-at-scale.md`'s parallel region-dispatch or
            its file deliverable: no subagent-dispatch tool is in `--allowedTools`,
            and an ephemeral runner has no durable scratchpad, so it works through
            files serially and writes a GitHub issue directly. That means the suite
            size matters — step 4's prioritize-and-report-skips rule is the guard
            against burning the turn budget before finishing. The core discipline is
            EMPIRICAL mutation, not reading:

            1. `${{ inputs.test_command }}` once — establish the green baseline.
            2. Run the Tier-1 pre-screen:
               `bash .claude/skills/test-quality/scripts/check-test-quality.sh src/`
            3. For each test file in SCOPE, read it AND its source. For each guard,
               mutate the source (delete a branch / swap an operator) with Edit, run
               just the affected test file with `${{ inputs.test_command }} <file>`
               (append the path if the runner supports single-file runs), confirm it
               goes RED, then `git checkout -- <file>` to revert. A mutation that stays GREEN is
               EITHER a test gap OR dead/redundant code — distinguish before
               reporting (principle 5). A surviving mutation is a receipt, not a
               guess.
            4. If you approach the turn budget, prioritize the highest-risk modules
               (stateful/concurrency/parsing over pure formatters) and explicitly
               list which files you did NOT reach. Do not silently truncate.

            ## Output — create ONE issue
            Create a single GitHub issue with the findings:
            `gh issue create --title "Test-quality audit: <ISO date>" --body "<markdown>"`
            (This workflow is manual, so a fresh issue per run is fine.) The body
            must lead with a receipts table (module | mutation | result), then each
            finding as: `file:line` — the mutation that survived — severity — a
            one-line fix. State the scope you covered and any files skipped. A clean
            audit is still a finding: if nothing survived, say so and list what was
            mutation-checked.
          # max_turns is allowlist-validated (digits-or-blank) above, so it can only
          # expand to a number here — never injected flags. When BLANK the
          # --max-turns flag is OMITTED and the audit runs uncapped (the 30-min job
          # timeout is the backstop); this is what lets a whole-suite audit finish.
          # --model is allowlist-validated above (fixed to the two IDs).
          claude_args: |
            --model ${{ inputs.model }}
            ${{ inputs.max_turns && format('--max-turns {0}', inputs.max_turns) || '' }}
            --allowedTools "Read,Grep,Glob,Edit,Bash(${{ inputs.test_command }}:*),Bash(bash .claude/skills/test-quality/scripts/check-test-quality.sh:*),Bash(git checkout:*),Bash(git diff:*),Bash(git status:*),Bash(gh issue create:*)"

      - name: Report run indicator (annotation + summary)
        # test-audit is dispatch-triggered and has NO PR/issue to comment on (it
        # CREATES a findings issue), so the run indicator is an annotation + a run
        # summary rather than a sticky comment. The action sets its execution_file
        # output only after a real run, so an empty value means the token stubbed out
        # and no audit ran. Gated on the audit step's outcome so an earlier
        # validation failure is NOT mislabeled as a token stub.
        if: ${{ always() && steps.token.outputs.present == 'true' && steps.claude.outcome != 'skipped' }}
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -n "${EXECUTION_FILE}" ]; then
            echo "::notice::Test-quality audit ran."
            echo "### ✅ Test-quality audit ran" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Test-quality audit did not run despite a token being present — check the logs; the token may be expired."
            {
              echo "### ⏭️ Test-quality audit skipped"
              echo
              echo "\`CLAUDE_CODE_OAUTH_TOKEN\` IS set but the audit did nothing. Check the workflow logs — the token may be expired or invalid."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
