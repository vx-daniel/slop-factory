# CI — the enforced quality gate.
#
# Runs the SAME gate as the local pre-commit hook (`bun run check:all` = Biome + tsc + tests), so
# "green" means one thing whether it ran on your machine or here. A commit made with `--no-verify`, or
# by someone without the hook installed, is caught at the PR instead of slipping into main. The only
# thing CI adds beyond the gate is coverage-threshold enforcement.
#
# This is the BUN variant of ci.yml. The Node variant differs in its setup action and install command,
# which is why each runtime module ships its own copy rather than sharing a templated one — the file
# contains ${{ }} expressions that a Handlebars pass would consume.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels an in-flight run — no point finishing stale CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3' # matches the `engines.bun` floor in package.json

      # --frozen-lockfile is the `npm ci` equivalent: it fails rather than silently resolving a
      # different dependency tree than bun.lock records. Without it CI can pass against versions no
      # developer has installed.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gate (Biome + tsc + tests)
        run: bun run check:all

      - name: Coverage thresholds
        run: bun run coverage
