name: Secret Scan (gitleaks)

# CALLER STUB — copy this into <your-repo>/.github/workflows/secret-scan.yml
#
# Catches the pull_request event locally and delegates to the shared reusable
# workflow in Viaanix/vx-repo-tools (pinned to a tag). The scan logic is
# single-sourced there; you only maintain this ~15-line stub.
#
# NO PREREQUISITES: unlike the Claude workflows, this needs no token or secret —
# gitleaks is a self-contained MIT binary. The only one-time setup is the org
# admin allowing this repo's reusable workflows to be called
# (Viaanix/vx-repo-tools → Settings → Actions → General → Access).
#
# ZERO-FILE ALTERNATIVE: because this scan is always-on, an org admin can enforce
# it across selected repos via an organization required-workflow ruleset instead
# of copying this stub into each repo.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    uses: Viaanix/vx-repo-tools/.github/workflows/secret-scan.yml@v1
    # The calling job must grant the permissions the reusable workflow needs —
    # a reusable workflow operates within the caller's GITHUB_TOKEN permissions.
    permissions:
      contents: read
      pull-requests: write
    # No `secrets: inherit` — gitleaks requires no token or license.
