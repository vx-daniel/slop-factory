# CI for the factory itself.
#
# Note this is the FACTORY's own CI — not to be confused with the `ci.yml` files under
# `modules/node/source/` and `modules/bun/source/`, which are templates copied into generated projects.
#
# The steps mirror `prepublishOnly` and are ordered cheap-first, so a typecheck failure surfaces in
# seconds rather than after several minutes of installs.
#
# Bun is installed because `tests/generation.test.ts` covers six combinations and four of them target
# Bun. Without it those four SKIP rather than fail — green, but only two-thirds verified.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches `engines.node`
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3' # matches the floor the bun module sets on generated projects

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and unit tests
        run: npm run check:all

      - name: Prompt contract
        run: npm run test:prompts

      - name: Packaging
        run: npm run test:packaging

      # Fails if the committed examples/ trees no longer match what the generator produces. This is the
      # step that keeps them from rotting silently — a stale example is a confident, wrong answer.
      - name: Examples are current
        run: npm run examples:check

      # Slowest, so last: generates all six combinations, installs each, and runs the generated
      # project's own gate and coverage.
      - name: Generation (all combinations)
        run: npm run verify
