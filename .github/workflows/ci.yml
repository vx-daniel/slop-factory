# CI for the factory itself.
#
# Note this is the FACTORY's own CI — not to be confused with the `ci.yml` files under
# `modules/node/source/` and `modules/bun/source/`, which are templates copied into generated projects.
#
# The steps mirror `prepublishOnly` and are ordered cheap-first, so a typecheck failure surfaces in
# seconds rather than after several minutes of installs.
#
# Bun is installed because the combination matrix `tests/generation.test.ts` DERIVES from the contract
# includes Bun rows. Without Bun on PATH those rows skip rather than fail — green, but partly unverified.
# No count is stated here on purpose: the matrix is derived precisely because hand-written counts drift.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches `engines.node`
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3' # matches the floor the bun module sets on generated projects

      - name: Install dependencies
        run: npm ci

      # Biome → tsc → Vitest, cheap-first. The factory's biome.jsonc EXTENDS the config it ships to
      # generated projects, so a green lint here means the same thing it means there — same rules, same
      # naming plugin, same pinned version.
      - name: Lint, typecheck, unit tests
        run: npm run check:all

      - name: Prompt contract
        run: npm run test:prompts

      # Generates into a temp directory and asserts WHERE files land, for every layout. It installs
      # nothing, so it is the only suite that can afford to cover the workspace combinations `verify`
      # deliberately skips. `modules/vitest-projects-in-ci.test.ts` exists because this step was missing
      # for four pull requests while two documents claimed it ran here.
      - name: File placement (every layout)
        run: npm run test:layout

      - name: Packaging
        run: npm run test:packaging

      # Fails if the committed examples/ trees no longer match what the generator produces. This is the
      # step that keeps them from rotting silently — a stale example is a confident, wrong answer.
      - name: Examples are current
        run: npm run examples:check

      # Slowest, so last: generates every combination the matrix marks as installed, installs each, and
      # runs the generated project's own gate and coverage. The rows it leaves un-installed are printed by
      # the suite itself rather than passing silently.
      - name: Generation (installed combinations)
        run: npm run verify
